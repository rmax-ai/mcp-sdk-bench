[project]
name = "mcp-sdk-bench-adk"
version = "0.1.0"
description = "ADK variant environment — google-adk[mcp] pins mcp 1.x; kept separate per DECISIONS.md D1"
requires-python = ">=3.13"
dependencies = [
    "google-adk[mcp]>=2.8.0",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.11",
    "typer>=0.27.2",
]

# Needed so `uv run --project envs/adk pytest tests/conformance/test_adk_variant.py`
# works (the ADK client smoke only runs in this env).
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
